<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoConquer - Mappa Territoriale</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .map-container {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            height: 600px;
        }
        
        #map {
            width: 100%;
            height: 100%;
        }
        
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .stat-item {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            color: white;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            display: block;
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .badge {
            padding: 8px 15px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .challenge-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .challenge-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        
        .challenge-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
            margin-top: 8px;
        }
        
        .status-pending {
            background: #ffeaa7;
            color: #d63031;
        }
        
        .status-accepted {
            background: #74b9ff;
            color: #0984e3;
        }
        
        .status-completed {
            background: #55efc4;
            color: #00b894;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .legend {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 GeoConquer</h1>
            <p class="subtitle">Mappe Interattive & Sistema di Sfide</p>
        </header>
        
        <div class="main-content">
            <div class="map-container">
                <div id="map"></div>
            </div>
            
            <div class="sidebar">
                <div class="card">
                    <h2>📊 Statistiche</h2>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-value" id="territories">0</span>
                            <span class="stat-label">Territori</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="area">0</span>
                            <span class="stat-label">Area (m²)</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="distance">0</span>
                            <span class="stat-label">Distanza (km)</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="level">1</span>
                            <span class="stat-label">Livello</span>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <h2>🏆 Badge Ottenuti</h2>
                    <div class="badge-container" id="badges">
                        <div class="badge">Nessun badge ancora</div>
                    </div>
                </div>
                
                <div class="card">
                    <h2>⚔️ Sfide Attive</h2>
                    <div class="challenge-list" id="challenges">
                        <p style="text-align: center; color: #999;">Nessuna sfida in corso</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2>🗺️ Legenda Mappa</h2>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: rgba(102, 126, 234, 0.5); border: 2px solid #667eea;"></div>
                    <span>I tuoi territori</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: rgba(231, 76, 60, 0.5); border: 2px solid #e74c3c;"></div>
                    <span>Territori di altri utenti</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: rgba(46, 204, 113, 0.5); border: 2px solid #2ecc71;"></div>
                    <span>Territori contesi (sfide)</span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_URL = 'http://localhost:3000/api';
        const CURRENT_USER_ID = 'demo-user';
        
        const map = L.map('map').setView([45.4642, 9.1900], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        const badgeIcons = {
            'first-step': '🚶',
            'explorer': '🗺️',
            'conqueror': '👑',
            'marathon': '🏃',
            'champion': '🏆'
        };
        
        async function loadTerritories() {
            try {
                const response = await fetch(`${API_URL}/territories`);
                const territories = await response.json();
                
                territories.forEach(territory => {
                    const coords = territory.coordinates.map(c => [c.latitude, c.longitude]);
                    const color = territory.userId === CURRENT_USER_ID ? '#667eea' : '#e74c3c';
                    
                    L.polygon(coords, {
                        color: color,
                        fillColor: color,
                        fillOpacity: 0.3,
                        weight: 2
                    }).addTo(map).bindPopup(`
                        <b>Territorio ${territory.id.slice(0, 8)}</b><br>
                        Area: ${Math.round(territory.area)} m²<br>
                        Conquistato: ${new Date(territory.conqueredAt).toLocaleDateString()}
                    `);
                });
            } catch (error) {
                console.error('Errore nel caricamento dei territori:', error);
            }
        }
        
        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/users/${CURRENT_USER_ID}/stats`);
                const data = await response.json();
                
                document.getElementById('territories').textContent = data.stats.territoriesCount;
                document.getElementById('area').textContent = Math.round(data.stats.totalArea);
                document.getElementById('distance').textContent = (data.stats.totalDistance / 1000).toFixed(2);
                document.getElementById('level').textContent = data.stats.level;
                
                const badgesContainer = document.getElementById('badges');
                if (data.stats.badges.length > 0) {
                    badgesContainer.innerHTML = '';
                    const badgesList = await fetch(`${API_URL}/badges`).then(r => r.json());
                    data.stats.badges.forEach(badgeId => {
                        const badge = badgesList.find(b => b.id === badgeId);
                        if (badge) {
                            const div = document.createElement('div');
                            div.className = 'badge';
                            div.innerHTML = `${badge.icon} ${badge.name}`;
                            div.title = badge.description;
                            badgesContainer.appendChild(div);
                        }
                    });
                }
            } catch (error) {
                console.error('Errore nel caricamento delle statistiche:', error);
            }
        }
        
        async function loadChallenges() {
            try {
                const response = await fetch(`${API_URL}/challenges/user/${CURRENT_USER_ID}`);
                const challenges = await response.json();
                
                const container = document.getElementById('challenges');
                if (challenges.length > 0) {
                    container.innerHTML = '';
                    challenges.forEach(challenge => {
                        const div = document.createElement('div');
                        div.className = 'challenge-item';
                        div.innerHTML = `
                            <strong>Sfida ${challenge.id.slice(0, 8)}</strong><br>
                            Territorio: ${challenge.territoryId.slice(0, 8)}<br>
                            <span class="challenge-status status-${challenge.status}">${challenge.status.toUpperCase()}</span>
                        `;
                        container.appendChild(div);
                    });
                }
            } catch (error) {
                console.error('Errore nel caricamento delle sfide:', error);
            }
        }
        
        loadTerritories();
        
        console.log('🌍 GeoConquer Map Demo');
        console.log('Visita http://localhost:3000/api per l\'API completa');
    </script>
</body>
</html>
