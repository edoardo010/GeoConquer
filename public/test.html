<!DOCTYPE html>
<html>
<head>
    <title>GeoConquer Test</title>
</head>
<body>
    <h1>Test API GeoConquer</h1>
    <div id="output" style="white-space: pre; background: #f0f0f0; padding: 20px; border-radius: 5px;">
        Testando...
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        async function test() {
            let output = '';

            try {
                // Test password requirements
                output += '1. Testing password requirements...\n';
                const res1 = await fetch(`${API_URL}/auth/password-requirements`);
                const data1 = await res1.json();
                output += JSON.stringify(data1, null, 2) + '\n\n';

                // Test registration
                output += '2. Testing registration...\n';
                const res2 = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: 'testuser2',
                        email: 'test2@example.com',
                        password: 'TestPass123!',
                        confirmPassword: 'TestPass123!'
                    })
                });
                const data2 = await res2.json();
                output += JSON.stringify(data2, null, 2) + '\n\n';

                // Test login
                output += '3. Testing login...\n';
                const res3 = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: 'testuser2',
                        password: 'TestPass123!'
                    })
                });
                const data3 = await res3.json();
                output += JSON.stringify(data3, null, 2) + '\n\n';

                // Test clans leaderboard
                output += '4. Testing clans leaderboard...\n';
                const res4 = await fetch(`${API_URL}/clans/leaderboard`);
                const data4 = await res4.json();
                output += JSON.stringify(data4, null, 2) + '\n\n';

                output += '✅ All tests passed!';
            } catch (error) {
                output += '❌ Error: ' + error.message;
            }

            document.getElementById('output').textContent = output;
        }

        window.addEventListener('load', test);
    </script>
</body>
</html>
