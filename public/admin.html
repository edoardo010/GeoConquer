<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoConquer Admin - Gestione Conquiste</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
        .admin-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
            background: var(--bg-darker);
        }

        .admin-sidebar {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .admin-sidebar-title {
            font-size: 1.2em;
            font-weight: 700;
            color: var(--primary-light);
            margin-bottom: 20px;
        }

        .admin-nav-btn {
            padding: 12px 16px;
            background: var(--bg-darker);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-weight: 600;
        }

        .admin-nav-btn:hover,
        .admin-nav-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .admin-main {
            display: flex;
            flex-direction: column;
        }

        .admin-header {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-title {
            font-size: 1.8em;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .admin-logout {
            padding: 10px 20px;
            background: var(--danger-color);
            color: white;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .admin-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3);
        }

        .admin-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .admin-section {
            display: none;
        }

        .admin-section.active {
            display: block;
        }

        .conquest-item {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-card-hover) 50%);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .conquest-item:hover {
            border-color: var(--primary-color);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
        }

        .conquest-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .conquest-user {
            font-size: 1.3em;
            font-weight: 700;
            color: var(--text-primary);
        }

        .conquest-status {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-pending {
            background: rgba(243, 156, 18, 0.2);
            color: #f39c12;
            border: 1px solid #f39c12;
        }

        .status-approved {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
        }

        .status-rejected {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .conquest-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }

        .detail-item {
            background: var(--bg-darker);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid var(--primary-color);
        }

        .detail-label {
            color: var(--text-muted);
            font-size: 0.85em;
            margin-bottom: 4px;
        }

        .detail-value {
            color: var(--text-primary);
            font-weight: 600;
        }

        .conquest-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .action-approve {
            background: var(--success-color);
            color: white;
        }

        .action-approve:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }

        .action-reject {
            background: var(--danger-color);
            color: white;
        }

        .action-reject:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .stat-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .rejection-form {
            background: var(--bg-darker);
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        .rejection-form.active {
            display: block;
        }

        .rejection-form textarea {
            width: 100%;
            padding: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            margin-bottom: 10px;
            resize: vertical;
            min-height: 80px;
        }

        .rejection-form textarea::placeholder {
            color: var(--text-muted);
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        @media (max-width: 1024px) {
            .admin-container {
                grid-template-columns: 1fr;
            }

            .admin-sidebar {
                display: flex;
                flex-direction: row;
                border-bottom: 1px solid var(--border-color);
                border-right: none;
                padding: 15px;
                gap: 10px;
                overflow-x: auto;
            }

            .admin-sidebar-title {
                display: none;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .conquest-details {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .admin-header {
                flex-direction: column;
                gap: 15px;
            }

            .conquest-actions {
                flex-direction: column;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <div class="admin-sidebar">
            <div class="admin-sidebar-title">⚙️ ADMIN PANEL</div>
            <button class="admin-nav-btn active" onclick="switchAdminSection('dashboard')">📊 Dashboard</button>
            <button class="admin-nav-btn" onclick="switchAdminSection('pending')">⏳ Conquiste in Sospeso</button>
            <button class="admin-nav-btn" onclick="switchAdminSection('approved')">✅ Approvate</button>
            <button class="admin-nav-btn" onclick="switchAdminSection('rejected')">❌ Rifiutate</button>
            <button class="admin-nav-btn" onclick="switchAdminSection('all')">📋 Tutte</button>
            <button class="admin-logout" onclick="handleAdminLogout()">Esci</button>
        </div>

        <!-- Main Content -->
        <div class="admin-main">
            <!-- Header -->
            <div class="admin-header">
                <div class="admin-title">🌍 GeoConquer Admin</div>
                <div id="adminInfo" style="color: var(--text-secondary); font-weight: 600;"></div>
            </div>

            <!-- Content -->
            <div class="admin-content">
                <!-- Login Section -->
                <div id="adminLoginSection" style="max-width: 400px; margin: 60px auto;">
                    <div class="card">
                        <h2 style="text-align: center; margin-top: 0;">🔐 Admin Login</h2>
                        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
                            <div class="form-group">
                                <label for="adminUsername">Username</label>
                                <input type="text" id="adminUsername" placeholder="admin_username" required>
                            </div>
                            <div class="form-group">
                                <label for="adminPassword">Password</label>
                                <input type="password" id="adminPassword" placeholder="••••••••" required>
                            </div>
                            <div class="loader" id="adminLoader"></div>
                            <button type="submit" class="btn-primary">Accedi come Admin</button>
                        </form>
                    </div>
                </div>

                <!-- Dashboard Section -->
                <div id="dashboardSection" class="admin-section" style="display: none;">
                    <h2>📊 Dashboard</h2>
                    <div class="stats-grid" id="statsGrid"></div>
                </div>

                <!-- Pending Section -->
                <div id="pendingSection" class="admin-section" style="display: none;">
                    <h2>⏳ Conquiste in Sospeso</h2>
                    <div class="filters">
                        <button class="filter-btn active" onclick="filterConquests('pending')">Tutte</button>
                        <button class="filter-btn" onclick="sortConquests('date')">Più Recenti</button>
                        <button class="filter-btn" onclick="sortConquests('area')">Per Area</button>
                    </div>
                    <div id="pendingList"></div>
                </div>

                <!-- Approved Section -->
                <div id="approvedSection" class="admin-section" style="display: none;">
                    <h2>✅ Conquiste Approvate</h2>
                    <div id="approvedList"></div>
                </div>

                <!-- Rejected Section -->
                <div id="rejectedSection" class="admin-section" style="display: none;">
                    <h2>❌ Conquiste Rifiutate</h2>
                    <div id="rejectedList"></div>
                </div>

                <!-- All Section -->
                <div id="allSection" class="admin-section" style="display: none;">
                    <h2>📋 Tutte le Conquiste</h2>
                    <div id="allList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let adminToken = null;
        let adminId = null;

        function switchAdminSection(section) {
            // Hide all sections
            document.querySelectorAll('.admin-section').forEach(el => {
                el.classList.remove('active');
            });

            // Remove active from nav buttons
            document.querySelectorAll('.admin-nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected section
            const sectionEl = document.getElementById(`${section}Section`);
            if (sectionEl) {
                sectionEl.classList.add('active');
                document.querySelector(`[onclick="switchAdminSection('${section}')"]`).classList.add('active');

                // Load data
                if (section === 'dashboard') {
                    loadDashboard();
                } else if (section === 'pending') {
                    loadConquests('pending');
                } else if (section === 'approved') {
                    loadConquests('approved');
                } else if (section === 'rejected') {
                    loadConquests('rejected');
                } else if (section === 'all') {
                    loadConquests('all');
                }
            }
        }

        async function handleAdminLogin(e) {
            e.preventDefault();

            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;

            // Default admin credentials
            if (username === 'admin_geoconquer' && password === 'GeoConquer123!@#Admin') {
                adminId = 'admin-' + Date.now();
                adminToken = 'admin-token-' + Date.now();

                localStorage.setItem('adminToken', adminToken);
                localStorage.setItem('adminId', adminId);

                document.getElementById('adminLoginSection').style.display = 'none';
                document.getElementById('adminInfo').textContent = `Admin: ${username}`;

                switchAdminSection('dashboard');
            } else {
                alert('❌ Credenziali admin non valide!');
            }
        }

        function handleAdminLogout() {
            adminToken = null;
            adminId = null;
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminId');

            document.getElementById('adminLoginSection').style.display = 'block';
            document.querySelectorAll('.admin-section').forEach(el => {
                el.classList.remove('active');
            });
            document.getElementById('adminLoginForm').reset();
        }

        async function loadDashboard() {
            try {
                const response = await fetch(`${API_URL}/conquests/admin/stats`, {
                    headers: {
                        'admin-id': adminId
                    }
                });

                const stats = await response.json();

                const html = `
                    <div class="stat-card">
                        <div class="stat-number">${stats.pending}</div>
                        <div class="stat-label">⏳ In Sospeso</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.approved}</div>
                        <div class="stat-label">✅ Approvate</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.rejected}</div>
                        <div class="stat-label">❌ Rifiutate</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.totalArea.toFixed(0)}</div>
                        <div class="stat-label">🗺️ Area (m²)</div>
                    </div>
                `;

                document.getElementById('statsGrid').innerHTML = html;
            } catch (error) {
                console.error('Errore caricamento dashboard:', error);
            }
        }

        async function loadConquests(status) {
            try {
                let endpoint = '';
                if (status === 'pending') {
                    endpoint = `${API_URL}/conquests/admin/pending`;
                } else if (status === 'all') {
                    endpoint = `${API_URL}/conquests/admin/all`;
                } else {
                    endpoint = `${API_URL}/conquests/admin/status/${status}`;
                }

                const response = await fetch(endpoint, {
                    headers: {
                        'admin-id': adminId
                    }
                });

                const data = await response.json();
                const conquests = data.conquests || [];

                let containerId = '';
                if (status === 'pending') {
                    containerId = 'pendingList';
                } else if (status === 'approved') {
                    containerId = 'approvedList';
                } else if (status === 'rejected') {
                    containerId = 'rejectedList';
                } else {
                    containerId = 'allList';
                }

                const container = document.getElementById(containerId);
                if (!container) return;

                if (conquests.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <p>Nessuna conquista trovata</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = conquests.map(conquest => `
                    <div class="conquest-item">
                        <div class="conquest-header">
                            <div>
                                <div class="conquest-user">👤 ${conquest.username}</div>
                                <div style="color: var(--text-muted); font-size: 0.9em; margin-top: 5px;">${conquest.territoryName}</div>
                            </div>
                            <span class="conquest-status status-${conquest.status}">${conquest.status.toUpperCase()}</span>
                        </div>
                        <div class="conquest-details">
                            <div class="detail-item">
                                <div class="detail-label">📏 Area</div>
                                <div class="detail-value">${conquest.area.toFixed(0)} m²</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">📍 Distanza</div>
                                <div class="detail-value">${conquest.distance.toFixed(1)} km</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">📅 Data</div>
                                <div class="detail-value">${new Date(conquest.createdAt).toLocaleDateString('it-IT')}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">⏰ Ora</div>
                                <div class="detail-value">${new Date(conquest.createdAt).toLocaleTimeString('it-IT')}</div>
                            </div>
                        </div>
                        <div class="detail-item" style="margin-bottom: 15px;">
                            <div class="detail-label">📝 Descrizione</div>
                            <div class="detail-value">${conquest.description}</div>
                        </div>
                        ${conquest.status === 'pending' ? `
                            <div class="conquest-actions">
                                <button class="action-btn action-approve" onclick="approveConquest('${conquest.id}')">✅ Approva</button>
                                <button class="action-btn action-reject" onclick="toggleRejectionForm('${conquest.id}')">❌ Rifiuta</button>
                            </div>
                            <div class="rejection-form" id="form-${conquest.id}">
                                <textarea id="reason-${conquest.id}" placeholder="Motivo del rifiuto..."></textarea>
                                <div style="display: flex; gap: 10px;">
                                    <button class="action-btn action-reject" onclick="rejectConquest('${conquest.id}')" style="flex: 1;">Conferma Rifiuto</button>
                                    <button class="action-btn" style="flex: 1; background: var(--text-muted);" onclick="toggleRejectionForm('${conquest.id}')">Annulla</button>
                                </div>
                            </div>
                        ` : ''}
                        ${conquest.status === 'rejected' ? `
                            <div class="detail-item">
                                <div class="detail-label">🚫 Motivo Rifiuto</div>
                                <div class="detail-value">${conquest.rejectionReason || 'Nessun motivo specificato'}</div>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            } catch (error) {
                console.error('Errore caricamento conquiste:', error);
            }
        }

        function toggleRejectionForm(id) {
            const form = document.getElementById(`form-${id}`);
            if (form) {
                form.classList.toggle('active');
            }
        }

        async function approveConquest(id) {
            try {
                const response = await fetch(`${API_URL}/conquests/${id}/approve`, {
                    method: 'POST',
                    headers: {
                        'admin-id': adminId
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    alert('✅ Conquista approvata!');
                    loadConquests('pending');
                    loadDashboard();
                } else {
                    alert('Errore: ' + data.error);
                }
            } catch (error) {
                alert('Errore di connessione: ' + error.message);
            }
        }

        async function rejectConquest(id) {
            const reason = document.getElementById(`reason-${id}`).value;

            if (!reason.trim()) {
                alert('Inserisci un motivo per il rifiuto');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/conquests/${id}/reject`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'admin-id': adminId
                    },
                    body: JSON.stringify({ reason })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('❌ Conquista rifiutata!');
                    loadConquests('pending');
                    loadDashboard();
                } else {
                    alert('Errore: ' + data.error);
                }
            } catch (error) {
                alert('Errore di connessione: ' + error.message);
            }
        }

        // Check if admin already logged in
        window.addEventListener('load', () => {
            const token = localStorage.getItem('adminToken');
            const id = localStorage.getItem('adminId');

            if (token && id) {
                adminToken = token;
                adminId = id;
                document.getElementById('adminLoginSection').style.display = 'none';
                document.getElementById('adminInfo').textContent = 'Admin: admin_geoconquer';
                switchAdminSection('dashboard');
            }
        });
    </script>
</body>
</html>
