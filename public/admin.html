<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoConquer Admin - Gestione Conquiste</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
        .admin-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
            background: var(--bg-darker);
        }

        .admin-sidebar {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .admin-sidebar-title {
            font-size: 1.2em;
            font-weight: 700;
            color: var(--primary-light);
            margin-bottom: 20px;
        }

        .admin-nav-btn {
            padding: 12px 16px;
            background: var(--bg-darker);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-weight: 600;
        }

        .admin-nav-btn:hover,
        .admin-nav-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .admin-main {
            display: flex;
            flex-direction: column;
        }

        .admin-header {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-title {
            font-size: 1.8em;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .admin-logout {
            padding: 10px 20px;
            background: var(--danger-color);
            color: white;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .admin-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3);
        }

        .admin-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .admin-section {
            display: none;
        }

        .admin-section.active {
            display: block;
        }

        .conquest-item {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-card-hover) 50%);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .conquest-item:hover {
            border-color: var(--primary-color);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
        }

        .conquest-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .conquest-user {
            font-size: 1.3em;
            font-weight: 700;
            color: var(--text-primary);
        }

        .conquest-status {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-pending {
            background: rgba(243, 156, 18, 0.2);
            color: #f39c12;
            border: 1px solid #f39c12;
        }

        .status-approved {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
        }

        .status-rejected {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .conquest-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }

        .detail-item {
            background: var(--bg-darker);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid var(--primary-color);
        }

        .detail-label {
            color: var(--text-muted);
            font-size: 0.85em;
            margin-bottom: 4px;
        }

        .detail-value {
            color: var(--text-primary);
            font-weight: 600;
        }

        .conquest-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .action-approve {
            background: var(--success-color);
            color: white;
        }

        .action-approve:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }

        .action-reject {
            background: var(--danger-color);
            color: white;
        }

        .action-reject:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .stat-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .rejection-form {
            background: var(--bg-darker);
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        .rejection-form.active {
            display: block;
        }

        .rejection-form textarea {
            width: 100%;
            padding: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            margin-bottom: 10px;
            resize: vertical;
            min-height: 80px;
        }

        .rejection-form textarea::placeholder {
            color: var(--text-muted);
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        @media (max-width: 1024px) {
            .admin-container {
                grid-template-columns: 1fr;
            }

            .admin-sidebar {
                display: flex;
                flex-direction: row;
                border-bottom: 1px solid var(--border-color);
                border-right: none;
                padding: 15px;
                gap: 10px;
                overflow-x: auto;
            }

            .admin-sidebar-title {
                display: none;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .conquest-details {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .admin-header {
                flex-direction: column;
                gap: 15px;
            }

            .conquest-actions {
                flex-direction: column;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <div class="admin-sidebar">
            <div class="admin-sidebar-title">⚙️ ADMIN PANEL</div>
            <button class="admin-nav-btn active" onclick="switchAdminSection('dashboard')">📊 Dashboard</button>
            <button class="admin-nav-btn" onclick="switchAdminSection('pending')">⏳ Conquiste in Sospeso</button>
            <button class="admin-nav-btn" onclick="switchAdminSection('approved')">✅ Approvate</button>
            <button class="admin-nav-btn" onclick="switchAdminSection('rejected')">❌ Rifiutate</button>
            <button class="admin-nav-btn" onclick="switchAdminSection('all')">📋 Tutte</button>
            <button class="admin-nav-btn" onclick="switchAdminSection('territories')">🗺️ Territori</button>
            <button class="admin-nav-btn" onclick="switchAdminSection('bans')">🚫 Ban</button>
            <button class="admin-nav-btn" onclick="switchAdminSection('database')">💾 Database</button>
            <button class="admin-nav-btn" onclick="switchAdminSection('activities')">🏃 Attività</button>
            <button class="admin-nav-btn" onclick="switchAdminSection('logActivity')">📝 Log Attività</button>
            <button class="admin-logout" onclick="handleAdminLogout()">Esci</button>
        </div>

        <!-- Main Content -->
        <div class="admin-main">
            <!-- Header -->
            <div class="admin-header">
                <div class="admin-title">🌍 GeoConquer Admin</div>
                <div id="adminInfo" style="color: var(--text-secondary); font-weight: 600;"></div>
            </div>

            <!-- Content -->
            <div class="admin-content">
                <!-- Login Section -->
                <div id="adminLoginSection" style="max-width: 400px; margin: 60px auto;">
                    <div class="card">
                        <h2 style="text-align: center; margin-top: 0;">🔐 Admin Login</h2>
                        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
                            <div class="form-group">
                                <label for="adminUsername">Username</label>
                                <input type="text" id="adminUsername" placeholder="admin_username" required>
                            </div>
                            <div class="form-group">
                                <label for="adminPassword">Password</label>
                                <input type="password" id="adminPassword" placeholder="••••••••" required>
                            </div>
                            <div class="loader" id="adminLoader"></div>
                            <button type="submit" class="btn-primary">Accedi come Admin</button>
                        </form>
                    </div>
                </div>

                <!-- Dashboard Section -->
                <div id="dashboardSection" class="admin-section" style="display: none;">
                    <h2>📊 Dashboard</h2>
                    <div class="stats-grid" id="statsGrid"></div>
                </div>

                <!-- Pending Section -->
                <div id="pendingSection" class="admin-section" style="display: none;">
                    <h2>⏳ Conquiste in Sospeso</h2>
                    <div class="filters">
                        <button class="filter-btn active" onclick="filterConquests('pending')">Tutte</button>
                        <button class="filter-btn" onclick="sortConquests('date')">Più Recenti</button>
                        <button class="filter-btn" onclick="sortConquests('area')">Per Area</button>
                    </div>
                    <div id="pendingList"></div>
                </div>

                <!-- Approved Section -->
                <div id="approvedSection" class="admin-section" style="display: none;">
                    <h2>✅ Conquiste Approvate</h2>
                    <div id="approvedList"></div>
                </div>

                <!-- Rejected Section -->
                <div id="rejectedSection" class="admin-section" style="display: none;">
                    <h2>❌ Conquiste Rifiutate</h2>
                    <div id="rejectedList"></div>
                </div>

                <!-- All Section -->
                <div id="allSection" class="admin-section" style="display: none;">
                    <h2>📋 Tutte le Conquiste</h2>
                    <div id="allList"></div>
                </div>

                <!-- Territory Conquests Section -->
                <div id="territoriesSection" class="admin-section" style="display: none;">
                    <h2>🗺️ Conquiste Territoriali</h2>
                    <div class="filters">
                        <button class="filter-btn active" onclick="filterTerritories('pending')">⏳ In Sospeso</button>
                        <button class="filter-btn" onclick="filterTerritories('approved')">✅ Approvate</button>
                        <button class="filter-btn" onclick="filterTerritories('flagged')">🚨 Cheat Rilevati</button>
                    </div>
                    <div id="territoriesList"></div>
                </div>

                <!-- Bans Section -->
                <div id="bansSection" class="admin-section" style="display: none;">
                    <h2>🚫 Ban Attivi</h2>
                    <div id="bansList"></div>
                </div>

                <!-- Database Section -->
                <div id="databaseSection" class="admin-section" style="display: none;">
                    <h2>💾 Database Admin</h2>
                    <div id="databaseInfo"></div>
                </div>

                <!-- Activities Section -->
                <div id="activitiesSection" class="admin-section" style="display: none;">
                    <h2>🏃 Attività degli Utenti</h2>
                    <div id="activitiesList"></div>
                </div>

                <!-- Log Activity Section -->
                <div id="logActivitySection" class="admin-section" style="display: none;">
                    <h2>📝 Registra Attività per Utente</h2>
                    <div class="card">
                        <form id="logActivityForm" onsubmit="handleLogActivityForUser(event)">
                            <div class="form-group">
                                <label for="logUserId">ID Utente</label>
                                <input type="text" id="logUserId" placeholder="user-id" required>
                            </div>
                            <div class="form-group">
                                <label for="logUsername">Username</label>
                                <input type="text" id="logUsername" placeholder="username" required>
                            </div>
                            <div class="form-group">
                                <label for="logActivityType">Tipo Attività</label>
                                <select id="logActivityType" style="padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary);" required>
                                    <option value="">Seleziona tipo...</option>
                                    <option value="running">🏃 Corsa</option>
                                    <option value="walking">🚶 Camminata</option>
                                    <option value="cycling">🚴 Ciclismo</option>
                                    <option value="hiking">⛰️ Trekking</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="logTitle">Titolo Attività</label>
                                <input type="text" id="logTitle" placeholder="es. Corsa mattutina al parco" required>
                            </div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                <div class="form-group">
                                    <label for="logDistance">Distanza (km)</label>
                                    <input type="number" id="logDistance" step="0.1" min="0" placeholder="5.5" required>
                                </div>
                                <div class="form-group">
                                    <label for="logDuration">Durata (minuti)</label>
                                    <input type="number" id="logDuration" min="0" placeholder="45" required>
                                </div>
                                <div class="form-group">
                                    <label for="logCalories">Calorie Bruciate</label>
                                    <input type="number" id="logCalories" min="0" placeholder="300">
                                </div>
                                <div class="form-group">
                                    <label for="logAvgSpeed">Velocità Media (km/h)</label>
                                    <input type="number" id="logAvgSpeed" step="0.1" min="0" placeholder="7.5">
                                </div>
                            </div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                <div class="form-group">
                                    <label for="logStartTime">Data/Ora Inizio</label>
                                    <input type="datetime-local" id="logStartTime" required>
                                </div>
                                <div class="form-group">
                                    <label for="logEndTime">Data/Ora Fine</label>
                                    <input type="datetime-local" id="logEndTime" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="logDescription">Descrizione (opzionale)</label>
                                <textarea id="logDescription" placeholder="Note sull'attività..." style="padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary); width: 100%; min-height: 80px;"></textarea>
                            </div>
                            <div class="loader" id="logActivityLoader"></div>
                            <button type="submit" class="btn-primary">Registra Attività</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let adminToken = null;
        let adminId = null;

        function switchAdminSection(section) {
            // Hide all sections
            document.querySelectorAll('.admin-section').forEach(el => {
                el.classList.remove('active');
            });

            // Remove active from nav buttons
            document.querySelectorAll('.admin-nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected section
            const sectionEl = document.getElementById(`${section}Section`);
            if (sectionEl) {
                sectionEl.classList.add('active');
                document.querySelector(`[onclick="switchAdminSection('${section}')"]`).classList.add('active');

                // Load data
                if (section === 'dashboard') {
                    loadDashboard();
                } else if (section === 'pending') {
                    loadConquests('pending');
                } else if (section === 'approved') {
                    loadConquests('approved');
                } else if (section === 'rejected') {
                    loadConquests('rejected');
                } else if (section === 'all') {
                    loadConquests('all');
                } else if (section === 'territories') {
                    loadTerritories('pending');
                } else if (section === 'bans') {
                    loadBans();
                } else if (section === 'database') {
                    loadDatabaseInfo();
                } else if (section === 'activities') {
                    loadActivities();
                }
            }
        }

        async function handleAdminLogin(e) {
            e.preventDefault();

            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;

            // Default admin credentials
            if (username === 'admin_geoconquer' && password === 'GeoConquer123!@#Admin') {
                adminId = 'admin-' + Date.now();
                adminToken = 'admin-token-' + Date.now();

                localStorage.setItem('adminToken', adminToken);
                localStorage.setItem('adminId', adminId);

                document.getElementById('adminLoginSection').style.display = 'none';
                document.getElementById('adminInfo').textContent = `Admin: ${username}`;

                switchAdminSection('dashboard');
            } else {
                alert('❌ Credenziali admin non valide!');
            }
        }

        function handleAdminLogout() {
            adminToken = null;
            adminId = null;
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminId');

            document.getElementById('adminLoginSection').style.display = 'block';
            document.querySelectorAll('.admin-section').forEach(el => {
                el.classList.remove('active');
            });
            document.getElementById('adminLoginForm').reset();
        }

        async function loadDashboard() {
            try {
                const response = await fetch(`${API_URL}/conquests/admin/stats`, {
                    headers: {
                        'admin-id': adminId
                    }
                });

                const stats = await response.json();

                const html = `
                    <div class="stat-card">
                        <div class="stat-number">${stats.pending}</div>
                        <div class="stat-label">⏳ In Sospeso</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.approved}</div>
                        <div class="stat-label">✅ Approvate</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.rejected}</div>
                        <div class="stat-label">❌ Rifiutate</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.totalArea.toFixed(0)}</div>
                        <div class="stat-label">🗺️ Area (m²)</div>
                    </div>
                `;

                document.getElementById('statsGrid').innerHTML = html;
            } catch (error) {
                console.error('Errore caricamento dashboard:', error);
            }
        }

        async function loadConquests(status) {
            try {
                let endpoint = '';
                if (status === 'pending') {
                    endpoint = `${API_URL}/conquests/admin/pending`;
                } else if (status === 'all') {
                    endpoint = `${API_URL}/conquests/admin/all`;
                } else {
                    endpoint = `${API_URL}/conquests/admin/status/${status}`;
                }

                const response = await fetch(endpoint, {
                    headers: {
                        'admin-id': adminId
                    }
                });

                const data = await response.json();
                const conquests = data.conquests || [];

                let containerId = '';
                if (status === 'pending') {
                    containerId = 'pendingList';
                } else if (status === 'approved') {
                    containerId = 'approvedList';
                } else if (status === 'rejected') {
                    containerId = 'rejectedList';
                } else {
                    containerId = 'allList';
                }

                const container = document.getElementById(containerId);
                if (!container) return;

                if (conquests.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <p>Nessuna conquista trovata</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = conquests.map(conquest => `
                    <div class="conquest-item">
                        <div class="conquest-header">
                            <div>
                                <div class="conquest-user">👤 ${conquest.username}</div>
                                <div style="color: var(--text-muted); font-size: 0.9em; margin-top: 5px;">${conquest.territoryName}</div>
                            </div>
                            <span class="conquest-status status-${conquest.status}">${conquest.status.toUpperCase()}</span>
                        </div>
                        <div class="conquest-details">
                            <div class="detail-item">
                                <div class="detail-label">📏 Area</div>
                                <div class="detail-value">${conquest.area.toFixed(0)} m²</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">📍 Distanza</div>
                                <div class="detail-value">${conquest.distance.toFixed(1)} km</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">📅 Data</div>
                                <div class="detail-value">${new Date(conquest.createdAt).toLocaleDateString('it-IT')}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">⏰ Ora</div>
                                <div class="detail-value">${new Date(conquest.createdAt).toLocaleTimeString('it-IT')}</div>
                            </div>
                        </div>
                        <div class="detail-item" style="margin-bottom: 15px;">
                            <div class="detail-label">📝 Descrizione</div>
                            <div class="detail-value">${conquest.description}</div>
                        </div>
                        ${conquest.status === 'pending' ? `
                            <div class="conquest-actions">
                                <button class="action-btn action-approve" onclick="approveConquest('${conquest.id}')">✅ Approva</button>
                                <button class="action-btn action-reject" onclick="toggleRejectionForm('${conquest.id}')">❌ Rifiuta</button>
                            </div>
                            <div class="rejection-form" id="form-${conquest.id}">
                                <textarea id="reason-${conquest.id}" placeholder="Motivo del rifiuto..."></textarea>
                                <div style="display: flex; gap: 10px;">
                                    <button class="action-btn action-reject" onclick="rejectConquest('${conquest.id}')" style="flex: 1;">Conferma Rifiuto</button>
                                    <button class="action-btn" style="flex: 1; background: var(--text-muted);" onclick="toggleRejectionForm('${conquest.id}')">Annulla</button>
                                </div>
                            </div>
                        ` : ''}
                        ${conquest.status === 'rejected' ? `
                            <div class="detail-item">
                                <div class="detail-label">🚫 Motivo Rifiuto</div>
                                <div class="detail-value">${conquest.rejectionReason || 'Nessun motivo specificato'}</div>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            } catch (error) {
                console.error('Errore caricamento conquiste:', error);
            }

        function toggleRejectionForm(id) {
            const form = document.getElementById(`form-${id}`);

                form.classList.toggle('active');

        async function approveConquest(id) {

                    alert('❌ Conquista rifiutata!');

                                <div class="detail-value">${activity.calories} kcal</div>

                            <div class="detail-item">

                                <div class="detail-label">📅 Data</div>

        function getActivityEmoji(type) {
            const emojis = {
                'running': '🏃',
                'walking': '🚶',
                'cycling': '🚴',
                'hiking': '⛰️'
            };
            return emojis[type] || '🏃';
        }

        async function handleLogActivityForUser(e) {
            e.preventDefault();

            const userId = document.getElementById('logUserId').value.trim();
            const username = document.getElementById('logUsername').value.trim();
            const type = document.getElementById('logActivityType').value;
            const title = document.getElementById('logTitle').value.trim();
            const distance = parseFloat(document.getElementById('logDistance').value);
            const duration = parseInt(document.getElementById('logDuration').value);
            const calories = parseInt(document.getElementById('logCalories').value) || 0;
            const avgSpeed = parseFloat(document.getElementById('logAvgSpeed').value) || 0;
            const startTime = new Date(document.getElementById('logStartTime').value);
            const endTime = new Date(document.getElementById('logEndTime').value);
            const description = document.getElementById('logDescription').value.trim();

            if (!userId || !username || !type || !title || !distance || !duration) {
                alert('Compila tutti i campi obbligatori');
                return;
            }

            if (startTime >= endTime) {
                alert('L\'ora di inizio deve essere prima dell\'ora di fine');
                return;
            }

            document.getElementById('logActivityLoader').classList.add('show');
            const submitBtn = document.querySelector('#logActivityForm button[type="submit"]');
            submitBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/activities/admin/log-for-user`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'admin-id': adminId
                    },
                    body: JSON.stringify({
                        userId,
                        username,
                        type,
                        title,
                        distance,
                        duration,
                        calories,
                        avgSpeed,
                        startTime,
                        endTime,
                        coordinates: [{ latitude: 45.5, longitude: 9.2 }],
                        maxSpeed: avgSpeed * 1.2,
                        description
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('✅ Attività registrata per l\'utente!');
                    document.getElementById('logActivityForm').reset();
                    loadActivities();
                } else {
                    alert('Errore: ' + data.error);
                }
            } catch (error) {
                alert('Errore di connessione: ' + error.message);
            } finally {
                document.getElementById('logActivityLoader').classList.remove('show');
                submitBtn.disabled = false;
            }
        }

        async function loadTerritories(status = 'pending') {
            try {
                let endpoint = '';
                if (status === 'flagged') {
                    endpoint = `${API_URL}/territory-conquests/admin/flagged`;
                } else if (status === 'pending') {
                    endpoint = `${API_URL}/territory-conquests/admin/pending`;
                } else {
                    endpoint = `${API_URL}/territory-conquests/admin/stats`;
                }

                const response = await fetch(endpoint, {
                    headers: { 'admin-id': adminId }
                });

                const data = await response.json();
                const conquests = data.conquests || [];

                const container = document.getElementById('territoriesList');
                if (!container) return;

                if (conquests.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-icon">🗺️</div><p>Nessuna conquista territoriale</p></div>';
                    return;
                }

                container.innerHTML = conquests.map(conquest => `
                    <div class="conquest-item">
                        <div class="conquest-header">
                            <div>
                                <div class="conquest-user">👤 ${conquest.username}</div>
                                <div style="color: var(--text-muted); font-size: 0.9em; margin-top: 5px;">
                                    🗺️ Territorio conquistato
                                </div>
                            </div>
                            <span class="conquest-status status-${conquest.status}">
                                ${conquest.status === 'flagged_cheat' ? '🚨 CHEAT' : conquest.status.toUpperCase()}
                            </span>
                        </div>
                        <div class="conquest-details">
                            <div class="detail-item">
                                <div class="detail-label">📏 Distanza</div>
                                <div class="detail-value">${conquest.distance.toFixed(2)} km</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">⏱️ Durata</div>
                                <div class="detail-value">${conquest.duration} min</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">⚡ Velocità</div>
                                <div class="detail-value">${conquest.calculatedSpeed.toFixed(1)} km/h</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">📅 Data</div>
                                <div class="detail-value">${new Date(conquest.createdAt).toLocaleDateString('it-IT')}</div>
                            </div>
                        </div>
                        ${conquest.status === 'pending' ? `
                            <div class="conquest-actions">
                                <button class="action-btn action-approve" onclick="approveTerritoryConquest('${conquest.id}')">✅ Approva</button>
                                <button class="action-btn action-reject" onclick="toggleTerritoryRejectionForm('${conquest.id}')">❌ Rifiuta</button>
                            </div>
                            <div class="rejection-form" id="form-${conquest.id}">
                                <textarea id="reason-${conquest.id}" placeholder="Motivo del rifiuto..."></textarea>
                                <div style="display: flex; gap: 10px;">
                                    <button class="action-btn action-reject" onclick="rejectTerritoryConquest('${conquest.id}')" style="flex: 1;">Conferma Rifiuto</button>
                                    <button class="action-btn" style="flex: 1; background: var(--text-muted);" onclick="toggleTerritoryRejectionForm('${conquest.id}')">Annulla</button>
                                </div>
                            </div>
                        ` : ''}
                        ${conquest.cheatDetected ? `
                            <div class="detail-item">
                                <div class="detail-label">🚨 Motivo Cheat</div>
                                <div class="detail-value">${conquest.reason}</div>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            } catch (error) {
                console.error('Errore caricamento territori:', error);
            }
        }

        function filterTerritories(status) {
            document.querySelectorAll('#territoriesSection .filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadTerritories(status);

        function toggleTerritoryRejectionForm(id) {

        async function approveTerritoryConquest(id) {
            try {

                    method: 'POST',

                    alert('✅ Territorio approvato!');

        async function rejectTerritoryConquest(id) {

            try {

        async function loadBans() {
            try {
                const response = await fetch(`${API_URL}/territory-conquests/admin/bans`, {
                    headers: { 'admin-id': adminId }
                });

                const data = await response.json();
                const bans = data.bans || [];

                const container = document.getElementById('bansList');
                if (!container) return;

                if (bans.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-icon">✅</div><p>Nessun ban attivo</p></div>';
                    return;
                }

                container.innerHTML = bans.map(ban => {
                    const timeRemaining = Math.ceil((new Date(ban.unbannedAt).getTime() - new Date().getTime()) / 1000);
                    const hours = Math.ceil(timeRemaining / 3600);
                    return `
                        <div class="conquest-item">
                            <div class="conquest-header">
                                <div>
                                    <div class="conquest-user">🚫 ${ban.username}</div>
                                    <div style="color: var(--text-muted); font-size: 0.9em; margin-top: 5px;">
                                        ${ban.reason}
                                    </div>
                                </div>
                                <span class="conquest-status status-rejected">BANNATO</span>
                            </div>
                            <div class="conquest-details">
                                <div class="detail-item">
                                    <div class="detail-label">⏰ Tempo Rimanente</div>
                                    <div class="detail-value">${hours}h</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">📅 Bannato il</div>
                                    <div class="detail-value">${new Date(ban.bannedAt).toLocaleDateString('it-IT')}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">🔓 Sbannato il</div>
                                    <div class="detail-value">${new Date(ban.unbannedAt).toLocaleDateString('it-IT')}</div>
                                </div>
                            </div>
                            <div class="conquest-actions">
                                <button class="action-btn action-approve" onclick="removeBanManual('${ban.userId}')" style="flex: 1;">🔓 Rimuovi Ban</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Errore caricamento ban:', error);
            }
        }

        async function removeBanManual(userId) {
            if (!confirm('Sei sicuro di voler rimuovere il ban?')) return;

            try {
                const response = await fetch(`${API_URL}/territory-conquests/admin/ban/${userId}`, {
                    method: 'DELETE',
                    headers: { 'admin-id': adminId }
                });

                if (response.ok) {
                    alert('✅ Ban rimosso!');
                    loadBans();
                } else {
                    alert('Errore rimozione ban');
                }
            } catch (error) {
                alert('Errore: ' + error.message);
            }
        }

        async function loadDatabaseInfo() {

                const response = await fetch(`${API_URL}/admin/database/info`, {
                    headers: { 'admin-id': adminId }
                });

                const data = await response.json();

                    <div class="card">
                        <div class="card-header">
                            <h3 style="margin: 0;">📊 Informazioni Database</h3>
                        </div>
                        <div style="background: var(--bg-darker); padding: 20px; border-radius: 8px; margin-bottom: 20px;">
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">

                                </div>
                                <div>
                                    <p style="color: var(--text-muted); margin: 0 0 5px 0;">💾 Spazio Totale</p>
                                    <p style="color: var(--text-primary); font-weight: 600; margin: 0;">${data.storage.totalSize}</p>
                                </div>
                                <div>
                                    <p style="color: var(--text-muted); margin: 0 0 5px 0;">🔄 Backup Disponibili</p>
                                    <p style="color: var(--text-primary); font-weight: 600; margin: 0;">${data.storage.backupCount}</p>

                            </div>
                            <div style="margin-top: 15px; padding: 15px; background: var(--bg-card); border-radius: 6px; border-left: 3px solid #10b981;">
                                <p style="margin: 0; color: #10b981; font-weight: 600;">✅ ${data.status}</p>

                                <p style="color: var(--text-primary); font-weight: 600; margin: 0; font-size: 1.5em;">${data.collections.conquests.count}</p>

                                <p style="color: var(--text-muted); margin: 0 0 5px 0;">⚔️ Clan</p>
                                <p style="color: var(--text-primary); font-weight: 600; margin: 0; font-size: 1.5em;">${data.collections.clans.count}</p>

                        <div style="display: flex; gap: 10px; margin-top: 30px;">

                `;
            } catch (error) {
                console.error('Errore caricamento database info:', error);
            }
        }

        async function createDatabaseBackup() {
            if (!confirm('Sei sicuro di voler creare un backup? Questo salverà tutti i dati in una cartella separata.')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/admin/database/backup`, {
                    method: 'POST',
                    headers: { 'admin-id': adminId }
                });

                const data = await response.json();

                if (response.ok) {
                    alert(`✅ Backup creato!\n\nTimestamp: ${data.timestamp}`);
                    loadDatabaseInfo();
                } else {
                    alert('Errore: ' + data.error);
                }
            } catch (error) {
                alert('Errore: ' + error.message);
            }
        }

        async function viewBackupList() {
            try {
                const response = await fetch(`${API_URL}/admin/database/backups`, {
                    headers: { 'admin-id': adminId }
                });

                const data = await response.json();
                const backups = data.backups || [];

                let html = '<h4>📋 Backup Disponibili</h4>';
                
                if (backups.length === 0) {
                    html += '<p style="color: var(--text-muted);">Nessun backup trovato</p>';
                } else {
                    html += '<div style="max-height: 400px; overflow-y: auto;">';
                    backups.forEach(backup => {
                        const date = new Date(backup.created).toLocaleString('it-IT');
                        const size = (backup.size / 1024).toFixed(2) + ' KB';
                        html += `
                            <div style="background: var(--bg-card); padding: 12px; margin-bottom: 10px; border-radius: 6px; border-left: 3px solid #667eea;">
                                <p style="margin: 0; font-weight: 600; color: var(--text-primary);">${backup.filename}</p>
                                <p style="margin: 5px 0 0 0; font-size: 0.85em; color: var(--text-muted);">📅 ${date} | 💾 ${size}</p>
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                const container = document.getElementById('databaseInfo');
                const existingBackupDiv = container.querySelector('h4');
                if (existingBackupDiv) {
                    existingBackupDiv.parentElement.innerHTML = html;
                }
            } catch (error) {
                alert('Errore: ' + error.message);
            }
        }

        // Check if admin already logged in
        window.addEventListener('load', () => {
            const token = localStorage.getItem('adminToken');
            const id = localStorage.getItem('adminId');

            if (token && id) {
                adminToken = token;
                adminId = id;
                document.getElementById('adminLoginSection').style.display = 'none';
                document.getElementById('adminInfo').textContent = 'Admin: admin_geoconquer';
                switchAdminSection('dashboard');
            }
        });
    </script>
